name: Backend Login Template

description: >
  Contability sistem using Specification Driven Development (SDD).

agent:
  priority:
    - User prompt
    - Proposal
    - Tasks
    - Specs
    - config.yaml

agentRules:
  - ALWAYS follow proposal.md, tasks.md and specs before implementing.
  - ALWAYS present a plan for non-trivial work.
  - ALWAYS ask before installing dependencies.
  - ALWAYS create unit tests for every new service.
  - ALWAYS create controller tests when applicable.
  - ALWAYS create e2e tests for new endpoints when applicable.
  - ALWAYS run lint and tests before considering a task complete.
  - NEVER finish a task if lint or tests fail.
  - NEVER use any unless explicitly justified.
  - NEVER hardcode secrets.
  - NEVER break the existing architecture.

stack:
  frontend:
    framework: React
    language: TypeScript
    bundler: Vite
    router: React Router
    forms: React Hook Form
    validation: Zod
    http: Axios
    packageManager: pnpm
    styling:
      - TailwindCSS
      - Shadcn UI
      - Responsive
      - Mobile First
      - Dark Mode
      - Lucide Icons

  backend:
    framework: NestJS
    runtime: Node.js 22
    language: TypeScript
    orm: Prisma
    auth:
      - JWT
      - Refresh Token
      - bcrypt
    validation: class-validator
    packageManager: pnpm

  database:
    engine: PostgreSQL

  infrastructure:
    docker: true
    dockerCompose: true

commands:
  frontend:
    dev: pnpm run dev
    build: pnpm run build
    lint: pnpm run lint
    test: pnpm run test
  backend:
    dev: pnpm run start:dev
    build: pnpm run build
    lint: pnpm run lint
    test: pnpm run test

architecture:
  style: Feature First
  principles:
    - SOLID
    - DRY
    - KISS
    - Separation of Concerns
    - Dependency Injection
    - Clean Architecture when it adds value

projectStructure:
  root:
    - frontend/
    - backend/
    - docker/
    - .openspec/
    - docker-compose.yml

codingStandards:
  language: English
  typescript:
    strict: true
    allowAny: false
  naming:
    variables: camelCase
    functions: camelCase
    classes: PascalCase
    interfaces: PascalCase
    files: kebab-case

backendRules:
  - Controllers only orchestrate requests.
  - Business logic belongs in services.
  - Data access belongs in repositories.
  - Validate every DTO.
  - Use async/await.
  - Handle every exception.

frontendRules:
  - Components must be small and reusable.
  - Pages compose components.
  - Shared logic goes into hooks.
  - API calls belong in services.

security:
  - Hash passwords.
  - Validate input.
  - Store secrets in environment variables.
  - Never commit .env.

testing:
  required: true
  rules:
    - Every new service MUST have unit tests.
    - Every endpoint MUST have tests when applicable.
    - Critical business logic MUST be tested.
    - Tests are mandatory before completing a task.

definitionOfDone:
  - Feature implemented.
  - Unit tests implemented.
  - Tests passing.
  - Lint passing.
  - No TypeScript errors.
  - Documentation updated if needed.

workflow:
  planning:
    - Explain the implementation plan.
    - Wait for approval on non-trivial tasks.
  execution:
    - Work on one task at a time.
    - Summarize changes at the end.

git:
  convention: Conventional Commits
  prefixes:
    - feat
    - fix
    - refactor
    - docs
    - test
    - chore

conventions:
  - Use pnpm.
  - Prefer interfaces.
  - Keep code readable.
  - Use "nest g resource <name> --no-spec" only if tests will be created manually afterwards.
  - Never duplicate code.

documentation:
  architecture: .openspec/architecture.md
  conventions: .openspec/conventions.md
  techStack: .openspec/tech-stack.md

goals:
  - Clean code.
  - High reuse.
  - Scalability.
  - Maintainability.
  - Production-ready template.
